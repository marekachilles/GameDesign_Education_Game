<div id="pause-menu" class="relative w-[1920px] h-[1080px] pointer-events-auto flex items-center justify-center">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60"></div>

    <!-- Menu Card -->
    <div class="relative p-8 flex flex-col items-center gap-6">
        <h2 class="title text-[60px] leading-[1.1] mb-2.5 font-normal text-white">Pause</h2>

        <div class="flex flex-col gap-4 w-96">
            <button
                id="pause-resume-btn"
                class="btn h-22 btn-primary p-4 border-b-2 border-white hover:bg-white/10 text-[28px] font-mono bg-transparent text-white cursor-pointer transition-all duration-200 w-full"
            >
                Fortsetzen
            </button>

            <button
                id="pause-restart-btn"
                class="btn h-22 btn-primary p-4 border-b-2 border-white hover:bg-white/10 text-[28px] font-mono bg-transparent text-white cursor-pointer transition-all duration-200 w-full"
            >
                Neu starten
            </button>

            <button
                id="pause-menu-btn"
                class="btn h-22 btn-primary p-4 border-b-2 border-white hover:bg-white/10 text-[28px] font-mono bg-transparent text-white cursor-pointer transition-all duration-200 w-full"
            >
                Hauptmenü
            </button>

            <button
                id="pause-wissensspeicher-btn"
                class="info-item h-22 knowledge-base flex items-center justify-center gap-[15px] p-4 border-b-2 border-white hover:bg-white/10 cursor-pointer w-full text-[28px] font-mono bg-transparent text-white transition-all duration-200"
            >
                <span class="label cursor-pointer">Wissensspeicher</span>
                <div class="icon-plain text-white flex items-center">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="48"
                        height="48"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
            </button>
        </div>

        <div class="text-white/60 font-mono text-sm mt-2 flex items-center gap-2">
            <span class="border border-white/40 rounded px-1.5 py-0.5 text-xs">ESC</span>
            <span>zum Fortsetzen</span>
        </div>
    </div>
</div>
